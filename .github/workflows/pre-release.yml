name: 2.0.x Development Build

on:
  push:
    branches:
      - "2.0.x"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Checkout Drools 9.106.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kiegroup/drools
          path: drools
          ref: 9.106.x-prod

      - name: Build Drools 9.106.0 with Maven
        run: cd drools && mvn --batch-mode --update-snapshots install -Dquickly && cd ..

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2.0.x
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify
      - run: mkdir staging && cp drools-ansible-rulebook-integration-runtime/target/drools*.jar staging && cp drools-ansible-rulebook-integration-main/target/drools-ansible-rulebook-integration-main-jar-with-dependencies.jar staging

      - name: Publish 2.0.x Development Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete 2.0.x-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create 2.0.x-latest staging/*.jar --repo "$GITHUB_REPOSITORY" \
            --prerelease --title "2.0.x Development Build" --target "$GITHUB_SHA" --generate-notes
