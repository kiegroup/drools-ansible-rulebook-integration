name: Tag Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. 2.0.2)'
        required: true
        type: string
      drools_ref:
        description: 'Drools branch (check version.drools in pom.xml of the tag, e.g. 9.106.0 -> 9.106.x-prod)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Checkout Drools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kiegroup/drools
          path: drools
          ref: ${{ inputs.drools_ref }}

      - name: Build Drools with Maven
        run: cd drools && mvn --batch-mode --update-snapshots install -Dquickly && cd ..

      - name: Checkout tag again
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots verify

      - name: Stage artifacts
        run: mkdir staging && cp drools-ansible-rulebook-integration-runtime/target/drools*.jar staging && cp drools-ansible-rulebook-integration-main/target/drools-ansible-rulebook-integration-main-jar-with-dependencies.jar staging

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" staging/*.jar --repo "$GITHUB_REPOSITORY" \
            --title "Release $RELEASE_TAG" --target "$RELEASE_TAG" \
            --notes "Release $RELEASE_TAG"
