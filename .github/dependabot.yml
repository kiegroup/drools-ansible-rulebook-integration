version: 2
updates:
  # main branch
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "main"
    commit-message:
      prefix: "[bot][main]"
    ignore:
      - dependency-name: "org.drools:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.kie:*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "[bot][main]"

  # 1.0.x branch
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "1.0.x"
    commit-message:
      prefix: "[bot][1.0.x]"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "1.0.x"
    commit-message:
      prefix: "[bot][1.0.x]"

  # 2.0.x branch
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "2.0.x"
    commit-message:
      prefix: "[bot][2.0.x]"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2.0.x"
    commit-message:
      prefix: "[bot][2.0.x]"
