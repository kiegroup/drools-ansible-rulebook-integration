version: 2
updates:
  # main branch
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "main"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "[bot][main]"
    ignore:
      - dependency-name: "org.drools:*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.kie:*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.openrewrite*"
          - "io.github.git-commit-id:*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    commit-message:
      prefix: "[bot][main]"
    groups:
      github-actions:
        patterns: ["*"]

  # 1.0.x branch
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "1.0.x"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "[bot][1.0.x]"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Stay on Jackson 2.21 LTS (patch updates only)
      - dependency-name: "com.fasterxml.jackson:jackson-bom"
        update-types: ["version-update:semver-minor"]
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.openrewrite*"
          - "io.github.git-commit-id:*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "1.0.x"
    commit-message:
      prefix: "[bot][1.0.x]"
    groups:
      github-actions:
        patterns: ["*"]

  # 2.0.x branch
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "2.0.x"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "[bot][2.0.x]"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Stay on Jackson 2.21 LTS (patch updates only)
      - dependency-name: "com.fasterxml.jackson:jackson-bom"
        update-types: ["version-update:semver-minor"]
    groups:
      maven-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.codehaus.mojo:*"
          - "org.openrewrite*"
          - "io.github.git-commit-id:*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2.0.x"
    commit-message:
      prefix: "[bot][2.0.x]"
    groups:
      github-actions:
        patterns: ["*"]
